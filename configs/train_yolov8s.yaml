# Pilot only: exercise the complete training/validation path, not a final benchmark.
# Paths are resolved relative to this YAML file.
model: ../models/pretrained/yolov8s.pt
data: ../datasets/processed/crack_detection/data.yaml
project: ../outputs/training
name: yolov8s_pilot
run_type: pilot

training:
  epochs: 2
  imgsz: 640
  batch: 2
  device: 0
  workers: 2
  seed: 42
  amp: true
  optimizer: AdamW
  lr0: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  nbs: 16
  warmup_epochs: 0.0
  patience: 0
  cache: false
  rect: false
  # Common, light augmentation; no Mosaic or geometry changes for this pilot.
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  shear: 0.0
  perspective: 0.0
  fliplr: 0.5
  flipud: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.1
  plots: true
  save: true
  exist_ok: false

evaluation:
  # AP uses low-score predictions; fixed-threshold P/R is computed separately.
  score_floor: 0.001
  confidence: 0.25
  match_iou: 0.5
  nms_iou: 0.7
  max_detections: 100
  preview_count: 6
