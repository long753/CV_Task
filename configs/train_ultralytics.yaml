# 统一正式训练配置：所有路径相对此文件；训练期间不使用测试集。
# models 中选择 yolov8s 或 yolov11s，其值为对应的 COCO 预训练权重。
models:
  yolov8s: ../models/pretrained/yolov8s.pt
  yolov11s: ../models/pretrained/yolo11s.pt
data: ../datasets/processed/crack_detection/data.yaml
project: ../outputs/training
trained_models: ../models/trained

# 以下为原生 Ultralytics train 参数，两个正式模型共用同一组设置。
training:
  epochs: 150
  fraction: 1.0
  imgsz: 640
  batch: 2
  nbs: 16
  device: 0
  workers: 2
  seed: 42
  deterministic: true
  amp: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  # Fixed training budget; best.pt is selected by validation mAP50-95.
  patience: 0
  val: true
  max_det: 100
  cache: false
  rect: false
  mosaic: 0.0
  close_mosaic: 0
  mixup: 0.0
  copy_paste: 0.0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  shear: 0.0
  perspective: 0.0
  fliplr: 0.5
  flipud: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.1
  plots: true
  save: true
  save_period: 25
  exist_ok: false

evaluation:
  score_floor: 0.001
  confidence: 0.25
  match_iou: 0.5
  nms_iou: 0.7
  max_detections: 100
  preview_count: 6

benchmark:
  imgsz: 640
  precision: fp32
  warmup: 50
  iterations: 300
  image_count: 6
